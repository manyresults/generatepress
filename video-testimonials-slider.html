<style>
  .lbvs{position:relative;display:flex;align-items:center;gap:.5rem}
  .lbvs__track{display:flex;gap:1.25rem;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:.25rem;flex:1 1 auto}
  .lbvs__track::-webkit-scrollbar{display:none}
  .lbvs__slide{flex:0 0 calc((100% - 2.5rem) / 3);scroll-snap-align:start}
  .lbvs__frame{position:relative;width:100%;padding-bottom:56.25%;height:0;border-radius:10px;overflow:hidden;background:#000;box-shadow:0 6px 24px rgba(0,0,0,.35)}
  .lbvs__frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .lbvs__nav{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:999px;border:0;cursor:pointer;color:var(--base,#fff);background:var(--accent,#0d6efd);transition:transform .15s ease,opacity .15s ease}
  .lbvs__nav:hover{transform:scale(1.06)}
  .lbvs__nav:disabled{opacity:.35;cursor:default;transform:none}
  @media (max-width:1024px){.lbvs__slide{flex:0 0 calc((100% - 1.25rem) / 2)}}
  @media (max-width:767px){.lbvs__slide{flex:0 0 100%}.lbvs__nav{width:38px;height:38px}}
</style>

<script>
(function(){
  var root = document.currentScript.closest('.lbvs') || document.querySelector('.lbvs');
  if(!root) return;
  var track = root.querySelector('.lbvs__track');
  var prev  = root.querySelector('.lbvs__nav--prev');
  var next  = root.querySelector('.lbvs__nav--next');

  function step(){
    var slide = track.querySelector('.lbvs__slide');
    if(!slide) return track.clientWidth;
    var gap = parseFloat(getComputedStyle(track).columnGap || getComputedStyle(track).gap) || 0;
    return slide.getBoundingClientRect().width + gap;
  }
  function update(){
    var maxScroll = track.scrollWidth - track.clientWidth - 2;
    prev.disabled = track.scrollLeft <= 2;
    next.disabled = track.scrollLeft >= maxScroll;
  }
  prev.addEventListener('click', function(){ track.scrollBy({left: -step(), behavior:'smooth'}); });
  next.addEventListener('click', function(){ track.scrollBy({left:  step(), behavior:'smooth'}); });
  track.addEventListener('scroll', update, {passive:true});
  window.addEventListener('resize', update);
  update();
})();
</script>
